<title>콩방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout concept: a wooden two-row shelf of glass tanks; open one to decorate and tend it. Pixel scenes sit inside soft, rounded UI. */
:root{
  --bg:#f5f2eb; --bg2:#ece8de; --panel:#fbf9f4; --ink:#38342c; --muted:#7f796b; --line:#ddd8cb;
  --accent:#f0b429; --accent-ink:#4a3300; --wood:#b98a5a; --wood-d:#8a6040; --wood-l:#d3a779;
  --glass:rgba(255,255,255,.55); --ok:#3f9a63; --warn:#d99a22; --bad:#d2584f; --shadow:rgba(80,60,30,.16);
  --f-display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
:root[data-theme="dark"]{
  --bg:#141f1b; --bg2:#1a2823; --panel:#21322a; --ink:#e6efe7; --muted:#9ab0a2; --line:#34493f;
  --accent:#f3c04a; --accent-ink:#3a2800; --wood:#8c6a49; --wood-d:#654630; --wood-l:#a5815c;
  --glass:rgba(170,215,195,.14); --ok:#5cc184; --warn:#e8b048; --bad:#ee7b72; --shadow:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:12px 40px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1500px;margin:0 auto 14px}
.trow{flex:1 1 100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:1.7rem;letter-spacing:.02em}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.coins{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 8px;font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.coins img{width:22px;height:22px;image-rendering:pixelated}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:7px 14px;font-family:var(--f-display);font-size:.95rem;line-height:1.2;transition:transform .08s,background .15s}
.btn:hover{background:var(--bg2)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
main{max-width:1500px;margin:0 auto}
.hint{color:var(--muted);margin:0 0 10px;font-size:.92rem}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:.82rem;white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)}

/* shelf */
.rack{overflow:visible;padding:6px 0 10px}
.rack-inner{display:flex;flex-direction:column;gap:12px;width:100%}
.strash{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;padding:14px 22px;border-radius:14px;background:#5b3a29;color:#fff;border:2px dashed #fff8;font-size:.95rem;pointer-events:auto}.strash.hot{background:#c0392b;transform:translateX(-50%) scale(1.08)}
.pager{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}.pgb{min-width:30px;height:28px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:inherit;font:inherit;font-size:.85rem;cursor:pointer}.pgb.on{background:var(--wood);color:#fff;border-color:var(--wood-d)}.pgb.add{border-style:dashed}

<p>콩방콩방은 작은 공벌레를 돌보며 마음을 쉬어 가는 힐링 키우기 게임이에요. 사육장을 꾸미고, 습도와 먹이를 챙기고, 공벌레가 자라고 번식하는 모습을 천천히 지켜볼 수 있어요. 별도의 설치 없이 웹 브라우저에서 바로 즐길 수 있어요.</p>
<h2>이런 게 있어요</h2>
<ul><li><b>다양한 공벌레 종</b> — 입문종부터 희귀종·레어종까지 60종 가까운 도트 공벌레를 만날 수 있어요. 종마다 색·무늬·크기·적정 습도가 달라요.</li>
<li><b>사육장 꾸미기</b> — 바닥재, 은신처, 먹이, 습도 조절 이끼와 수태 등으로 나만의 사육장을 만들어요.</li>
<li><b>번식과 변이</b> — 건강하게 키우면 새끼가 태어나고, 드물게 색이 다른 변이 개체가 나와요. 세대를 거치며 같은 변이를 고정해 갈 수도 있어요.</li>
<li><b>친구와 함께</b> — 친구 사육방 구경, 함께 관리, 분양, 채팅, 우편함을 지원해요.</li>
<li><b>미니게임</b> — 가볍게 즐기는 콩팝 같은 미니게임으로 코인을 모아요.</li></ul>
<h2>키우는 팁</h2>
<p>종마다 좋아하는 습도가 달라요. 사육장 화면의 습도 표시를 확인하고, 이끼에 물을 주어 적정 습도를 유지해 주세요. 먹이는 30분마다 줄 수 있고, 먹이가 떨어지면 공벌레가 굶을 수 있어요. 곰팡이와 버섯은 보이는 대로 치워 주세요. 어린 개체는 탈피를 하며 자라는데, 이때 칼슘 보충이 도움이 돼요.</p>
<p>이 게임은 실제 공벌레 사육을 단순화한 놀이이고, 실제 사육 지침이 아니에요.</p>
<h2>문의</h2><p>문의는 게임 안 우편함이나 서비스 운영자에게 남겨 주세요.</p></template><template id="tpl_privacy"><h1>개인정보처리방침</h1>
<p>콩방콩방(이하 '서비스')은 이용자의 개인정보를 소중히 다루며, 아래와 같이 처리해요.</p>
<h2>1. 수집하는 정보</h2>
<ul><li><b>Google 로그인을 쓸 때:</b> 구글 계정의 고유 ID(UID), 이름, 프로필 사진 주소, 이메일 주소(로그인 인증용).</li>
<li><b>게임을 하면서 생기는 정보:</b> 사육장·공벌레 저장 데이터, 코인, 닉네임, 친구 ID와 친구 목록, 채팅·우편 내용, 미니게임 기록.</li>
<li>로그인하지 않으면 저장 데이터는 이용자의 브라우저(localStorage)에만 남고 서버로 보내지지 않아요.</li></ul>
<h2>2. 이용 목적</h2><p>로그인과 저장 데이터 동기화, 친구·분양·채팅 등 서비스 기능 제공, 부정 이용 방지, 서비스 개선에 사용해요.</p>
<h2>3. 보관과 처리 위탁</h2>
<p>정보는 Google의 Firebase(Authentication, Cloud Firestore)에 저장돼요. 보관 기간은 이용자가 탈퇴(저장 데이터 삭제)를 요청하거나 서비스를 종료할 때까지예요.</p>
<h2>4. 광고와 쿠키</h2>
<p>서비스는 Google AdSense 등 제3자 광고를 게재할 수 있어요. Google을 포함한 제3자 공급업체는 쿠키를 사용해 이용자의 이전 방문 기록을 바탕으로 광고를 게재해요. Google의 광고 쿠키 사용으로 Google과 파트너는 이 사이트 및 다른 사이트 방문 기록을 바탕으로 광고를 보여줄 수 있어요. 이용자는 <a href="https://adssettings.google.com" target="_blank" rel="noopener">Google 광고 설정</a>에서 맞춤 광고를 해제할 수 있고, <a href="https://www.aboutads.info" target="_blank" rel="noopener">aboutads.info</a>에서 제3자 맞춤 광고 쿠키를 거부할 수 있어요. 광고가 없는 단계에서는 광고 쿠키가 사용되지 않아요.</p>
<h2>5. 제3자 제공</h2><p>법령에 근거가 있는 경우를 제외하고 이용자의 개인정보를 제3자에게 판매하거나 제공하지 않아요. 친구에게는 이용자의 이름(또는 닉네임), 프로필 이미지, 친구 ID만 보여요.</p>
<h2>6. 이용자의 권리</h2><p>이용자는 언제든 자신의 정보 열람·수정·삭제를 요청할 수 있어요. 아래 문의처로 연락해 주세요. 로그인 없이 쓴 데이터는 브라우저 저장소를 지우면 삭제돼요.</p>
<h2>7. 아동</h2><p>만 14세 미만 아동은 보호자의 동의 없이 Google 로그인을 사용하지 말아 주세요.</p>
<h2>8. 문의</h2><p>문의는 게임 안 우편함이나 서비스 운영자에게 남겨 주세요.</p>

function mpBulkFeed() {
  advanceAll();
  const ts = speciesTanks(), cost = MP_ZUCCHINI * ts.length;
  if (!ts.length) { toast('노래기가 있는 사육장이 없어요.'); return; }
  openModal(sh => sh.append(h('h2', { text: '일괄 애호박 주기' }), h('p', { class: 'hint', text: '노래기가 있는 사육장 ' + ts.length + '곳에 애호박을 한 번씩 줘요. (' + MP_ZUCCHINI + '코인 × ' + ts.length + ' = ' + cost + '코인)' }),
    h('div', { class: 'seg' }, h('button', { class: 'btn primary', type: 'button', onclick: () => {
      if (S.coins < cost) { toast('코인이 부족해요. (필요 ' + cost + ' / 보유 ' + S.coins + ')'); return; }
      let n = 0; for (const t of ts) if (!mpFeed(t)) n++;
      saveGame(); closeModal(); renderHome(); toast('사육장 ' + n + '곳에 애호박을 줬어요. (-' + (n * MP_ZUCCHINI) + '코인)');
    } }, '주기'), h('button', { class: 'btn', type: 'button', onclick: closeModal }, '취소'))));
}

let shLast = null, shCl = null, shClAt = 0;
const shKey = () => 'gb-coins:' + (typeof CL !== 'undefined' && CL.uid ? CL.uid : 'local');
function shRead() { try { const o = JSON.parse(localStorage.getItem(shKey()) || 'null'); return o && Number.isFinite(o.c) ? o : null; } catch (e) { return null; } }
function shWrite() {
  if (!S || shLast === null || S.coins === shLast) return;
  shLast = S.coins; try { localStorage.setItem(shKey(), JSON.stringify({ c: S.coins, t: Date.now() })); } catch (e) { }
  if (Date.now() - shClAt > 1800000) shFlush();
}
async function shFlush() {
  if (!S || typeof cloudOn !== 'function' || !cloudOn() || !CL.ready || shCl === S.coins) return;
  shClAt = Date.now(); const c = S.coins;
  if (await wr('data/users/' + CL.uid + '/shared', { c, t: Date.now() })) shCl = c;
}
async function sharedCoinsLoad() {
  const loc = shRead(); let cl = null;
  try { if (cloudOn()) cl = await rd('data/users/' + CL.uid + '/shared'); } catch (e) { }
  let best = loc; if (cl && Number.isFinite(cl.c) && (!best || (cl.t || 0) > best.t)) best = cl;
  if (!best && window.__MP) {   // 노래기방을 처음 열 때: 콩방에서 쓰던 코인을 이어받아요
    let v = null;
    try { const raw = localStorage.getItem('gongbeolre-room' + '-v1' + (CL.uid ? ':' + CL.uid : '')); const o = raw && JSON.parse(raw); if (o && Number.isFinite(o.coins)) v = o.coins; } catch (e) { }
    if (v === null && cloudOn()) { const md = await rd('data/users/' + CL.uid + (window.__MP ? '/mpmeta' : '/meta')); if (md && Number.isFinite(md.coins)) v = md.coins; }
    if (v !== null) best = { c: v, t: 0 };
  }
  if (best) S.coins = best.c;
  shLast = null; if (S) { shLast = -1; shWrite(); }
  if (cl && best === cl) shCl = cl.c;
}

  try { if (!S || e.key !== shKey() || !e.newValue) return; const o = JSON.parse(e.newValue); if (o && Number.isFinite(o.c) && o.c !== S.coins) { S.coins = o.c; shLast = o.c; updateCoins(); } } catch (x) { }
});

let lobbyEl = null;
function lobbyBuild() {
  if (lobbyEl) return lobbyEl;
  const d = document.createElement('div'); d.id = 'lobbyScene'; d.hidden = true;
  d.innerHTML = '<div class="lbwrap"><img class="lbimg" alt="콩방 방 전경" draggable="false">' +
    '<button type="button" class="lbhot lbbook" id="lbBook" aria-label="친구와 설정"></button>' +
    '<button type="button" class="lbhot" id="lbEnter" aria-label="공벌레 사육장으로 들어가기"></button>' +
    '<button type="button" class="lbhot lbmilli" id="lbMilli" aria-label="노래기방으로 들어가기"></button></div>';
  d.insertAdjacentHTML('beforeend', '<div class="lbcoin" aria-label="보유 코인"><img alt=""><b id="lbCoinN">0</b></div>');
  try { d.querySelector('.lbcoin img').src = COIN; document.getElementById('lbCoinN') || 0; } catch (e) { }
  document.body.appendChild(d);
  try { updateCoins(); } catch (e) { }
  d.querySelector('.lbimg').src = LOBBY_IMG;
  d.querySelector('#lbMilli').addEventListener('click', () => { window.__MPSET(true); });
  const hot = d.querySelector('#lbEnter');
  const menu = document.createElement('div'); menu.className = 'lbinfo'; menu.hidden = true;
  menu.innerHTML = '<div class="lbcard" role="dialog" aria-modal="true" aria-label="메뉴"><h3>📖 책</h3>' +
    '<div class="lbmenu"><button type="button" class="btn" data-m="friends">👥 친구 리스트</button><button type="button" class="btn" data-m="set">⚙ 설정</button></div>' +
    '<div class="lbbtns"><button type="button" class="btn" data-m="close">닫기</button></div></div>';
  d.appendChild(menu);
  menu.addEventListener('click', e => {
    e.stopPropagation();
    const m = e.target.getAttribute && e.target.getAttribute('data-m');
    if (e.target === menu || m === 'close') { menu.hidden = true; return; }
    if (m === 'friends' || m === 'set') { menu.hidden = true; const b = document.getElementById(m === 'friends' ? 'btnFriends' : 'btnSet'); if (b) b.click(); }
  });
  d.querySelector('#lbBook').addEventListener('click', () => { menu.hidden = false; });
  const info = document.createElement('div'); info.className = 'lbinfo'; info.hidden = true;
  info.innerHTML = '<div class="lbcard" role="dialog" aria-modal="true" aria-label="등각류&혹톡토기"><h3>등각류&amp;혹톡토기</h3>' +
    '<p>공벌레, 쥐며느리, 혹톡토기를 키우는 사육장이에요.</p>' +
    '<div class="lbbtns"><button type="button" class="btn" data-x="close">닫기</button><button type="button" class="btn primary" data-x="enter">들어가기</button></div></div>';
  d.appendChild(info);
  info.addEventListener('click', e => {
    e.stopPropagation();
    const x = e.target.getAttribute && e.target.getAttribute('data-x');
    if (x === 'enter') { info.hidden = true; lobbyHide(); } else if (x === 'close' || e.target === info) info.hidden = true;
  });
  let lp = 0, lpDone = false, lx = 0, ly = 0, lpAt = 0;
  hot.addEventListener('pointerdown', e => {
    lpDone = false; lx = e.clientX; ly = e.clientY; clearTimeout(lp);
    lp = setTimeout(() => { lpDone = true; lpAt = Date.now(); info.hidden = false; }, 500);
  });
  const lpCancel = () => clearTimeout(lp);
  hot.addEventListener('pointermove', e => { if (Math.abs(e.clientX - lx) > 10 || Math.abs(e.clientY - ly) > 10) lpCancel(); });
  hot.addEventListener('pointerup', lpCancel); hot.addEventListener('pointerleave', lpCancel); hot.addEventListener('pointercancel', lpCancel);

  }

  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), fdb = firebase.firestore();
  // 아이폰/사파리에서는 스트리밍 연결이 쓰기만 응답 없이 멈추는 경우가 있어서, 처음부터 롱폴링으로 연결해요
  const isSafari = /iP(hone|ad|od)/.test(navigator.userAgent) || (/Safari/.test(navigator.userAgent) && !/Chrome|Chromium|CriOS|FxiOS|Android/.test(navigator.userAgent));
  fdb.settings(Object.assign({ ignoreUndefinedProperties: true }, isSafari ? { experimentalForceLongPolling: true } : { experimentalAutoDetectLongPolling: true }));
  window.__fsMode = isSafari ? '롱폴링(고정)' : '자동';

  // Firestore는 undefined 값을 싫어해요 → JSON으로 한 번 걸러서 저장
  const clean = d => JSON.parse(JSON.stringify(d));
  const wrapDoc = r => new Proxy(r, { get(t, k) {
    if (k === 'set') return d => t.set(clean(d));
    if (k === 'update') return d => t.update(clean(d));
    if (k === 'collection') return n => wrapCol(t.collection(n));
    const v = t[k]; return typeof v === 'function' ? v.bind(t) : v;
  } });
  const wrapCol = c => new Proxy(c, { get(t, k) {
    if (k === 'add') return d => t.add(clean(d));
    if (k === 'doc') return id => wrapDoc(id ? t.doc(id) : t.doc());
    if (k === 'where') return (...a) => wrapCol(t.where(...a));
    const v = t[k]; return typeof v === 'function' ? v.bind(t) : v;
  } });
  const db = { doc: p => wrapDoc(fdb.doc(p)), collection: p => wrapCol(fdb.collection(p)) };

  // 진단용: SDK를 거치지 않고 REST로 직접 써 보면 서버가 돌려주는 진짜 오류(예: 사용량 초과)를 볼 수 있어요
  window.__fsRest = async () => {
    try {
      const u = auth.currentUser; if (!u) return '로그인 안 됨';
      const tok = await u.getIdToken(), t0 = Date.now();
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 12000);
      const r = await fetch('https://firestore.googleapis.com/v1/projects/' + FIREBASE_CONFIG.projectId + '/databases/(default)/documents/profiles/' + u.uid, { method: 'PATCH', signal: ctl.signal, headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: { name: { stringValue: u.displayName || '' }, avatarUrl: { stringValue: u.photoURL || '' } } }) });
      clearTimeout(to); const txt = await r.text(); let m = ''; try { const j = JSON.parse(txt); m = (j.error && (j.error.status + ' · ' + String(j.error.message || '').slice(0, 140))) || ''; } catch (e) { m = txt.slice(0, 120); }
      return 'HTTP ' + r.status + (m ? ' · ' + m : ' · 성공') + ' (' + (Date.now() - t0) + 'ms)';
    } catch (e) { return '요청 실패: ' + ((e && (e.name + ' ' + e.message)) || e); }
  };

  function install(u) {
    const user = {
      id: async () => u.uid,
      email: async () => u.emailVerified === false ? '' : (u.email || ''),
      can: async () => true,
      profiles: async ids => {
        const out = {};
        await Promise.all([].concat(ids).map(async id => {
          try { const s = await fdb.doc('profiles/' + id).get(); const d = s.exists ? s.data() : {}; out[id] = { id, name: d.name || '', avatarUrl: d.avatarUrl || '' }; }
          catch (e) { out[id] = { id, name: '', avatarUrl: '' }; }
        }));
        return out;
      },
    };
    window.claude = { use: async n => n === 'db' ? db : n === 'user' ? user : null };
    fdb.doc('profiles/' + u.uid).set({ name: u.displayName || '', avatarUrl: u.photoURL || '' }).catch(() => { });
    const top = document.querySelector('.top-r');
    if (top && !$g('btnOut')) {
      const b = document.createElement('button'); b.className = 'btn'; b.id = 'btnOut'; b.type = 'button'; b.textContent = '로그아웃';
      b.title = (u.displayName || u.email || '') + ' 로그아웃';
      b.onclick = async () => { try { await auth.signOut(); } catch (e) { } location.reload(); };
      top.append(b);
    }
  }

  btnG.onclick = async () => {
    say('Google 로그인 창을 여는 중…'); btnG.disabled = true;
    const cap = window.Capacitor;
    if (cap && cap.isNativePlatform && cap.isNativePlatform()) {   // 앱(안드로이드)에서는 기기의 Google 로그인을 써요
      try {
        const FA = cap.registerPlugin('FirebaseAuthentication');
        const r = await FA.signInWithGoogle({ skipNativeAuth: true });
        const idt = r && r.credential && r.credential.idToken;
        if (!idt) throw new Error('no-token');
        await auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(idt, r.credential.accessToken || null));
      } catch (e) { say('로그인에 실패했어요: ' + ((e && (e.code || e.message)) || e), true); btnG.disabled = false; }
      return;
    }
    const prov = new firebase.auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(prov); }
    catch (e) {
      if (e && /popup|operation-not-supported|cancelled/.test(e.code || '')) {
        if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') { say('로그인이 취소됐어요.'); btnG.disabled = false; return; }
        try { await auth.signInWithRedirect(prov); return; } catch (e2) { e = e2; }
      }
      say('로그인에 실패했어요: ' + (e && e.code || e), true); btnG.disabled = false;
    }
  };

  say('로그인 상태를 확인하는 중…'); btnG.disabled = true;
  auth.getRedirectResult().catch(e => say('로그인에 실패했어요: ' + (e && e.code || e), true));
  auth.onAuthStateChanged(u => {
    if (u) { install(u); start(); }
    else if (!started) { say(''); btnG.disabled = false; }
  });
})();
</script>
</body>
</html>
